name: Build APK
on: workflow_dispatch
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - name: Write project
        run: |
          mkdir -p $(dirname settings.gradle.kts)
          cat > settings.gradle.kts <<'EOF_FILE'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositories { google(); mavenCentral() } }
          rootProject.name = "QureoAI"
          include(":app")
          EOF_FILE
          mkdir -p $(dirname build.gradle.kts)
          cat > build.gradle.kts <<'EOF_FILE'
          plugins {
              id("com.android.application") version "8.7.3" apply false
              id("org.jetbrains.kotlin.android") version "2.0.21" apply false
              id("org.jetbrains.kotlin.plugin.compose") version "2.0.21" apply false
          }
          EOF_FILE
          mkdir -p $(dirname gradle.properties)
          cat > gradle.properties <<'EOF_FILE'
          org.gradle.jvmargs=-Xmx2g
          android.useAndroidX=true
          EOF_FILE
          mkdir -p $(dirname app/build.gradle.kts)
          cat > app/build.gradle.kts <<'EOF_FILE'
          plugins { id("com.android.application"); id("org.jetbrains.kotlin.android"); id("org.jetbrains.kotlin.plugin.compose") }
          android {
              namespace = "com.qureo.assistant"
              compileSdk = 35
              defaultConfig { applicationId = "com.qureo.assistant"; minSdk = 26; targetSdk = 35; versionCode = 1; versionName = "1.0" }
              buildTypes { release { isMinifyEnabled = false; signingConfig = signingConfigs.getByName("debug") } }
              buildFeatures { compose = true }
              compileOptions { sourceCompatibility = JavaVersion.VERSION_17; targetCompatibility = JavaVersion.VERSION_17 }
              kotlinOptions { jvmTarget = "17" }
          }
          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.9.3")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.ui:ui")
              implementation("org.jetbrains.kotlinx:kotlinx-coroutines-android:1.9.0")
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/AndroidManifest.xml)
          cat > app/src/main/AndroidManifest.xml <<'EOF_FILE'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
              <uses-permission android:name="android.permission.INTERNET"/>
              <uses-permission android:name="android.permission.SYSTEM_ALERT_WINDOW"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
              <uses-permission android:name="android.permission.FOREGROUND_SERVICE_MEDIA_PROJECTION"/>
              <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
              <application android:label="QUREO AI" android:theme="@android:style/Theme.Material.Light.NoActionBar" android:allowBackup="false">
                  <activity android:name=".MainActivity" android:exported="true">
                      <intent-filter><action android:name="android.intent.action.MAIN"/><category android:name="android.intent.category.LAUNCHER"/></intent-filter>
                  </activity>
                  <service android:name=".AssistService" android:exported="false" android:foregroundServiceType="mediaProjection"/>
              </application>
          </manifest>
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/qureo/assistant/Store.kt)
          cat > app/src/main/java/com/qureo/assistant/Store.kt <<'EOF_FILE'
          package com.qureo.assistant

          import android.content.Context
          import android.security.keystore.KeyGenParameterSpec
          import android.security.keystore.KeyProperties
          import android.util.Base64
          import java.security.KeyStore
          import javax.crypto.Cipher
          import javax.crypto.KeyGenerator
          import javax.crypto.SecretKey
          import javax.crypto.spec.GCMParameterSpec

          /** API key is encrypted with an AndroidKeyStore AES-GCM key; it is never in the APK. */
          object Store {
              private fun sp(c: Context) = c.getSharedPreferences("q", 0)
              private fun key(): SecretKey {
                  val ks = KeyStore.getInstance("AndroidKeyStore").apply { load(null) }
                  (ks.getKey("qk", null) as? SecretKey)?.let { return it }
                  val g = KeyGenerator.getInstance("AES", "AndroidKeyStore")
                  g.init(KeyGenParameterSpec.Builder("qk", KeyProperties.PURPOSE_ENCRYPT or KeyProperties.PURPOSE_DECRYPT)
                      .setBlockModes(KeyProperties.BLOCK_MODE_GCM).setEncryptionPaddings(KeyProperties.ENCRYPTION_PADDING_NONE).build())
                  return g.generateKey()
              }
              fun saveKey(c: Context, k: String) {
                  val ci = Cipher.getInstance("AES/GCM/NoPadding"); ci.init(Cipher.ENCRYPT_MODE, key())
                  val e = ci.doFinal(k.toByteArray())
                  sp(c).edit().putString("k", Base64.encodeToString(ci.iv + e, Base64.NO_WRAP)).apply()
              }
              fun apiKey(c: Context): String {
                  val s = sp(c).getString("k", null) ?: return ""
                  return try {
                      val b = Base64.decode(s, Base64.NO_WRAP)
                      val ci = Cipher.getInstance("AES/GCM/NoPadding")
                      ci.init(Cipher.DECRYPT_MODE, key(), GCMParameterSpec(128, b.copyOfRange(0, 12)))
                      String(ci.doFinal(b, 12, b.size - 12))
                  } catch (e: Exception) { "" }
              }
              fun lang(c: Context) = sp(c).getInt("lang", 0)          // 0 en, 1 ar, 2 fr
              fun setLang(c: Context, v: Int) = sp(c).edit().putInt("lang", v).apply()
              fun auto(c: Context) = sp(c).getBoolean("auto", true)
              fun setAuto(c: Context, v: Boolean) = sp(c).edit().putBoolean("auto", v).apply()
          }

          object Tx {
              private val M = mapOf(
                  "solve" to arrayOf("SOLVE", "حلّ", "RÉSOUDRE"),
                  "scan" to arrayOf("Scanning screen…", "جارٍ مسح الشاشة…", "Analyse de l’écran…"),
                  "think" to arrayOf("Solving & verifying…", "جارٍ الحل والتحقق…", "Résolution et vérification…"),
                  "nokey" to arrayOf("Add your API key in the app first.", "أضف مفتاح API في التطبيق أولاً.", "Ajoutez d’abord votre clé API."),
                  "newex" to arrayOf("New exercise detected. Tap SOLVE.", "تم اكتشاف تمرين جديد. اضغط حلّ.", "Nouvel exercice détecté. Touchez RÉSOUDRE."),
                  "ready" to arrayOf("Ready. Open an exercise, then tap SOLVE.", "جاهز. افتح تمرينًا ثم اضغط حلّ.", "Prêt. Ouvrez un exercice puis touchez RÉSOUDRE."),
                  "verified" to arrayOf("✓ Verified", "✓ تم التحقق", "✓ Vérifié"),
                  "unver" to arrayOf("⚠ Not fully verified", "⚠ لم يتم التحقق بالكامل", "⚠ Non vérifié à 100 %"),
                  "cant" to arrayOf("Can’t answer", "لا يمكن الإجابة", "Réponse impossible"),
                  "explain" to arrayOf("Explain", "اشرح", "Expliquer"),
                  "copy" to arrayOf("Copy", "نسخ", "Copier"),
                  "err" to arrayOf("Error", "خطأ", "Erreur"),
                  "running" to arrayOf("Assistant is running", "المساعد يعمل", "L’assistant est actif"),
                  "apikey" to arrayOf("Anthropic API key", "مفتاح Anthropic API", "Clé API Anthropic"),
                  "save" to arrayOf("Save key", "حفظ المفتاح", "Enregistrer la clé"),
                  "auto" to arrayOf("Offer to analyze new exercises automatically", "اقتراح تحليل التمارين الجديدة تلقائيًا", "Proposer d’analyser les nouveaux exercices"),
                  "grant" to arrayOf("1. Allow display over other apps", "١. السماح بالعرض فوق التطبيقات", "1. Autoriser l’affichage par-dessus"),
                  "start" to arrayOf("2. Start assistant", "٢. تشغيل المساعد", "2. Démarrer l’assistant"),
                  "stop" to arrayOf("Stop assistant", "إيقاف المساعد", "Arrêter l’assistant"),
                  "saved" to arrayOf("Saved", "تم الحفظ", "Enregistré"),
                  "intro" to arrayOf("Floating assistant for QUREO. It reads the pixels of your screen (with your permission each session) and answers with AI.",
                      "مساعد عائم لـ QUREO. يقرأ ما يظهر على شاشتك (بإذنك في كل جلسة) ويجيب بالذكاء الاصطناعي.",
                      "Assistant flottant pour QUREO. Il lit l’écran (avec votre accord à chaque session) et répond avec l’IA.")
              )
              fun t(l: Int, k: String) = M[k]!![l]
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/qureo/assistant/Claude.kt)
          cat > app/src/main/java/com/qureo/assistant/Claude.kt <<'EOF_FILE'
          package com.qureo.assistant

          import org.json.JSONArray
          import org.json.JSONObject
          import java.net.HttpURLConnection
          import java.net.URL

          object Claude {
              const val MODEL = "claude-sonnet-5-5"
              data class Result(val ok: Boolean, val verified: Boolean, val answer: String, val code: String, val why: String, val note: String)

              fun call(key: String, prompt: String, b64: String): String {
                  val img = JSONObject().put("type", "image").put("source", JSONObject().put("type", "base64").put("media_type", "image/jpeg").put("data", b64))
                  val txt = JSONObject().put("type", "text").put("text", prompt)
                  val body = JSONObject().put("model", MODEL).put("max_tokens", 2000)
                      .put("messages", JSONArray().put(JSONObject().put("role", "user").put("content", JSONArray().put(img).put(txt))))
                  val c = URL("https://api.anthropic.com/v1/messages").openConnection() as HttpURLConnection
                  c.requestMethod = "POST"; c.connectTimeout = 15000; c.readTimeout = 90000; c.doOutput = true
                  c.setRequestProperty("content-type", "application/json"); c.setRequestProperty("x-api-key", key); c.setRequestProperty("anthropic-version", "2023-06-01")
                  c.outputStream.use { it.write(body.toString().toByteArray()) }
                  val code = c.responseCode
                  val s = (if (code in 200..299) c.inputStream else c.errorStream).bufferedReader().readText()
                  if (code !in 200..299) throw IllegalStateException("API $code: " + runCatching { JSONObject(s).getJSONObject("error").getString("message") }.getOrDefault(s.take(120)))
                  val arr = JSONObject(s).getJSONArray("content")
                  return (0 until arr.length()).map { arr.getJSONObject(it) }.filter { it.optString("type") == "text" }.joinToString("") { it.getString("text") }
              }

              private fun json(t: String): JSONObject {
                  val a = t.indexOf('{'); val b = t.lastIndexOf('}')
                  require(a >= 0 && b > a) { "bad reply" }
                  return JSONObject(t.substring(a, b + 1))
              }

              private fun solvePrompt(lang: String) = """You are an expert tutor for 2nd-year Baccalaureate informatics (algorithmics, Python, SQL, HTML/CSS/JS, databases). The image is a phone screenshot showing a QUREO exercise in a browser. Read only the exercise; ignore browser UI and any floating assistant panel. Types: "mcq", "code", "open".
          Never guess. For MCQ evaluate every option and quote the chosen option exactly. For code, trace every example in the statement by hand and keep the required names and I/O format. If no complete exercise is visible, or options/data are cut off, set status "insufficient" and say what is missing in explanation.
          Write answer and explanation in $lang unless the exercise is clearly in another language. Reply with ONLY JSON: {"status":"ok"|"insufficient","type":"mcq"|"code"|"open","answer":"final answer (MCQ: option + text; code: one-line summary; open: the answer)","code":"full code or empty string","explanation":"max 4 short sentences"}"""

              private fun verifyPrompt(cand: JSONObject) = """You are a strict independent examiner. Check this candidate solution for the QUREO exercise in the image. Do NOT trust it: for MCQ evaluate every option yourself; for code trace it by hand on each example and check syntax, names and I/O format.
          Reply with ONLY JSON: {"valid":true|false,"issues":"short, empty if none","corrected":null or {"answer":"...","code":"...","explanation":"..."}}
          Set valid=true only if you are confident it is fully correct.
          CANDIDATE: $cand"""

              fun solve(key: String, lang: String, b64: String): Result {
                  var r = json(call(key, solvePrompt(lang), b64))
                  if (r.optString("status") != "ok" || r.optString("answer").isBlank()) return Result(false, false, "", "", r.optString("explanation"), "")
                  var v = json(call(key, verifyPrompt(r), b64))
                  if (!v.optBoolean("valid")) {
                      val c = v.optJSONObject("corrected")
                      if (c != null && c.optString("answer").isNotBlank()) {
                          r = JSONObject(r.toString()).put("answer", c.optString("answer")).put("code", c.optString("code")).put("explanation", c.optString("explanation"))
                          v = json(call(key, verifyPrompt(r), b64))
                      }
                  }
                  return Result(true, v.optBoolean("valid"), r.optString("answer"), r.optString("code"), r.optString("explanation"), v.optString("issues"))
              }
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/qureo/assistant/MainActivity.kt)
          cat > app/src/main/java/com/qureo/assistant/MainActivity.kt <<'EOF_FILE'
          package com.qureo.assistant

          import android.Manifest
          import android.content.Intent
          import android.content.pm.PackageManager
          import android.media.projection.MediaProjectionManager
          import android.net.Uri
          import android.os.Build
          import android.os.Bundle
          import android.provider.Settings
          import android.widget.Toast
          import androidx.activity.ComponentActivity
          import androidx.activity.compose.setContent
          import androidx.activity.result.contract.ActivityResultContracts
          import androidx.compose.foundation.layout.*
          import androidx.compose.foundation.rememberScrollState
          import androidx.compose.foundation.verticalScroll
          import androidx.compose.material3.*
          import androidx.compose.runtime.*
          import androidx.compose.ui.Alignment
          import androidx.compose.ui.Modifier
          import androidx.compose.ui.platform.LocalContext
          import androidx.compose.ui.platform.LocalLayoutDirection
          import androidx.compose.ui.text.input.PasswordVisualTransformation
          import androidx.compose.ui.unit.LayoutDirection
          import androidx.compose.ui.unit.dp

          class MainActivity : ComponentActivity() {
              private var ov by mutableStateOf(false)

              private val proj = registerForActivityResult(ActivityResultContracts.StartActivityForResult()) { r ->
                  val d = r.data
                  if (r.resultCode == RESULT_OK && d != null) {
                      startForegroundService(Intent(this, AssistService::class.java).putExtra("code", r.resultCode).putExtra("data", d))
                      moveTaskToBack(true)
                  }
              }
              private val notif = registerForActivityResult(ActivityResultContracts.RequestPermission()) { launchProjection() }

              private fun launchProjection() = proj.launch(getSystemService(MediaProjectionManager::class.java).createScreenCaptureIntent())

              private fun start() {
                  val l = Store.lang(this)
                  if (!Settings.canDrawOverlays(this)) { openOverlaySettings(); return }
                  if (Store.apiKey(this).isBlank()) { Toast.makeText(this, Tx.t(l, "nokey"), Toast.LENGTH_LONG).show(); return }
                  if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission(Manifest.permission.POST_NOTIFICATIONS) != PackageManager.PERMISSION_GRANTED)
                      notif.launch(Manifest.permission.POST_NOTIFICATIONS) else launchProjection()
              }
              private fun openOverlaySettings() = startActivity(Intent(Settings.ACTION_MANAGE_OVERLAY_PERMISSION, Uri.parse("package:$packageName")))

              override fun onResume() { super.onResume(); ov = Settings.canDrawOverlays(this) }

              override fun onCreate(b: Bundle?) {
                  super.onCreate(b)
                  setContent { MaterialTheme { Screen() } }
              }

              @Composable
              fun Screen() {
                  val c = LocalContext.current
                  var key by remember { mutableStateOf(Store.apiKey(c)) }
                  var lang by remember { mutableStateOf(Store.lang(c)) }
                  var auto by remember { mutableStateOf(Store.auto(c)) }
                  val t = { k: String -> Tx.t(lang, k) }
                  CompositionLocalProvider(LocalLayoutDirection provides if (lang == 1) LayoutDirection.Rtl else LayoutDirection.Ltr) {
                      Column(Modifier.fillMaxSize().systemBarsPadding().verticalScroll(rememberScrollState()).padding(16.dp), verticalArrangement = Arrangement.spacedBy(12.dp)) {
                          Text("QUREO AI Assistant", style = MaterialTheme.typography.headlineMedium)
                          Text(t("intro"))
                          Row(horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              listOf("English", "العربية", "Français").forEachIndexed { i, n ->
                                  FilterChip(selected = lang == i, onClick = { lang = i; Store.setLang(c, i) }, label = { Text(n) })
                              }
                          }
                          OutlinedTextField(key, { key = it }, Modifier.fillMaxWidth(), label = { Text(t("apikey")) }, singleLine = true, visualTransformation = PasswordVisualTransformation())
                          OutlinedButton({ Store.saveKey(c, key.trim()); Toast.makeText(c, t("saved"), Toast.LENGTH_SHORT).show() }) { Text(t("save")) }
                          Row(verticalAlignment = Alignment.CenterVertically, horizontalArrangement = Arrangement.spacedBy(8.dp)) {
                              Switch(auto, { auto = it; Store.setAuto(c, it) }); Text(t("auto"), Modifier.weight(1f))
                          }
                          if (!ov) Button({ openOverlaySettings() }, Modifier.fillMaxWidth()) { Text(t("grant")) }
                          Button({ Store.saveKey(c, key.trim()); start() }, Modifier.fillMaxWidth()) { Text(t("start")) }
                          OutlinedButton({ c.startService(Intent(c, AssistService::class.java).setAction("stop")) }, Modifier.fillMaxWidth()) { Text(t("stop")) }
                      }
                  }
              }
          }
          EOF_FILE
          mkdir -p $(dirname app/src/main/java/com/qureo/assistant/AssistService.kt)
          cat > app/src/main/java/com/qureo/assistant/AssistService.kt <<'EOF_FILE'
          package com.qureo.assistant

          import android.app.*
          import android.content.*
          import android.content.pm.ServiceInfo
          import android.graphics.*
          import android.graphics.drawable.GradientDrawable
          import android.graphics.drawable.Icon
          import android.hardware.display.DisplayManager
          import android.hardware.display.VirtualDisplay
          import android.media.Image
          import android.media.ImageReader
          import android.media.projection.MediaProjection
          import android.media.projection.MediaProjectionManager
          import android.os.*
          import android.util.Base64
          import android.view.*
          import android.widget.*
          import androidx.core.content.IntentCompat
          import kotlinx.coroutines.*
          import java.io.ByteArrayOutputStream
          import kotlin.math.abs

          class AssistService : Service() {
              private val scope = CoroutineScope(SupervisorJob() + Dispatchers.Main)
              private lateinit var wm: WindowManager
              private var mp: MediaProjection? = null
              private var vd: VirtualDisplay? = null
              private var ir: ImageReader? = null
              private var held: Image? = null
              private var bubble: TextView? = null
              private var panel: LinearLayout? = null
              private lateinit var status: TextView
              private lateinit var ansTv: TextView
              private lateinit var codeTv: TextView
              private lateinit var scroll: ScrollView
              private lateinit var actions: LinearLayout
              private lateinit var solveBtn: Button
              private var last: Claude.Result? = null
              private var showWhy = false
              private var busy = false
              private var lang = 0
              private var w = 0
              private var h = 0
              private var sigPrev: IntArray? = null
              private var moving = false

              private fun t(k: String) = Tx.t(lang, k)
              private fun dp(x: Int) = (x * resources.displayMetrics.density).toInt()
              private fun round(c: Int, r: Float) = GradientDrawable().apply { setColor(c); cornerRadius = r }

              override fun onBind(i: Intent?): IBinder? = null

              override fun onStartCommand(i: Intent?, f: Int, id: Int): Int {
                  if (i == null || i.action == "stop") { stopSelf(); return START_NOT_STICKY }
                  if (mp != null) return START_NOT_STICKY
                  lang = Store.lang(this)
                  val nm = getSystemService(NotificationManager::class.java)
                  nm.createNotificationChannel(NotificationChannel("q", "QUREO AI", NotificationManager.IMPORTANCE_LOW))
                  val stopPi = PendingIntent.getService(this, 0, Intent(this, AssistService::class.java).setAction("stop"), PendingIntent.FLAG_IMMUTABLE)
                  val n = Notification.Builder(this, "q").setContentTitle("QUREO AI").setContentText(t("running"))
                      .setSmallIcon(android.R.drawable.ic_menu_search)
                      .addAction(Notification.Action.Builder(Icon.createWithResource(this, android.R.drawable.ic_delete), "Stop", stopPi).build()).build()
                  // Must be called before getMediaProjection() on Android 14+.
                  startForeground(1, n, ServiceInfo.FOREGROUND_SERVICE_TYPE_MEDIA_PROJECTION)
                  val data = IntentCompat.getParcelableExtra(i, "data", Intent::class.java)
                  if (data == null) { stopSelf(); return START_NOT_STICKY }
                  try {
                      setupProjection(i.getIntExtra("code", 0), data)
                      buildUi()
                      startAuto()
                  } catch (e: Exception) { stopSelf() }
                  return START_NOT_STICKY
              }

              private fun setupProjection(code: Int, data: Intent) {
                  val m = getSystemService(MediaProjectionManager::class.java)
                  val p = m.getMediaProjection(code, data)
                  mp = p
                  // Android 14+: callback must be registered before creating the VirtualDisplay.
                  p.registerCallback(object : MediaProjection.Callback() { override fun onStop() { stopSelf() } }, Handler(Looper.getMainLooper()))
                  val dm = resources.displayMetrics
                  w = dm.widthPixels; h = dm.heightPixels
                  val r = ImageReader.newInstance(w, h, PixelFormat.RGBA_8888, 3)
                  r.setOnImageAvailableListener({ x ->
                      val n = x.acquireLatestImage()
                      if (n != null) { held?.close(); held = n }
                  }, Handler(Looper.getMainLooper()))
                  ir = r
                  vd = p.createVirtualDisplay("q", w, h, dm.densityDpi, DisplayManager.VIRTUAL_DISPLAY_FLAG_AUTO_MIRROR, r.surface, null, null)
              }

              private fun grab(): Bitmap? {
                  val im = held ?: return null
                  val p = im.planes[0]
                  val full = Bitmap.createBitmap(p.rowStride / p.pixelStride, h, Bitmap.Config.ARGB_8888)
                  p.buffer.rewind(); full.copyPixelsFromBuffer(p.buffer)
                  return if (full.width == w) full else Bitmap.createBitmap(full, 0, 0, w, h).also { full.recycle() }
              }

              private fun encode(bm: Bitmap): String {
                  val k = minOf(1f, 2000f / maxOf(bm.width, bm.height))
                  val s = if (k < 1f) Bitmap.createScaledBitmap(bm, (bm.width * k).toInt(), (bm.height * k).toInt(), true) else bm
                  val o = ByteArrayOutputStream(); s.compress(Bitmap.CompressFormat.JPEG, 85, o)
                  return Base64.encodeToString(o.toByteArray(), Base64.NO_WRAP)
              }

              /** Cheap luminance signature of the top 55% of the screen (the panel sits at the bottom). */
              private fun sig(bm: Bitmap): IntArray {
                  val top = Bitmap.createBitmap(bm, 0, 0, bm.width, (bm.height * 0.55f).toInt())
                  val s = Bitmap.createScaledBitmap(top, 20, 24, true)
                  val a = IntArray(20 * 24); s.getPixels(a, 0, 20, 0, 0, 20, 24)
                  return IntArray(a.size) { (Color.red(a[it]) * 3 + Color.green(a[it]) * 6 + Color.blue(a[it])) / 10 }
              }

              private fun startAuto() = scope.launch {
                  while (isActive) {
                      delay(2500)
                      if (!Store.auto(this@AssistService) || busy) continue
                      val bm = grab() ?: continue
                      val s = sig(bm); bm.recycle()
                      val p = sigPrev; sigPrev = s
                      if (p == null) continue
                      var sum = 0
                      for (j in s.indices) sum += abs(s[j] - p[j])
                      val d = sum / s.size
                      if (d > 14) moving = true
                      else if (moving && d < 4) { moving = false; flagNew() }
                  }
              }

              private fun flagNew() {
                  bubble?.apply { text = "!"; background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFFFF8A00.toInt()) } }
                  if (panel?.visibility == View.VISIBLE && !busy) status.text = t("newex")
              }

              private fun solve() {
                  if (busy) return
                  val key = Store.apiKey(this)
                  if (key.isBlank()) { status.text = t("nokey"); return }
                  busy = true; solveBtn.isEnabled = false; status.text = t("scan")
                  setHidden(true)
                  scope.launch {
                      try {
                          delay(450) // let the overlay disappear from the next captured frame
                          val bm = grab()
                          setHidden(false)
                          if (bm == null) { status.text = t("err") + ": no frame"; return@launch }
                          val b64 = withContext(Dispatchers.Default) { encode(bm) }
                          bm.recycle()
                          status.text = t("think")
                          val r = withContext(Dispatchers.IO) { Claude.solve(key, arrayOf("English", "Arabic", "French")[lang], b64) }
                          last = r; showWhy = false
                          if (r.ok) render() else status.text = t("cant") + (if (r.why.isNotBlank()) ": " + r.why else "")
                      } catch (e: Exception) {
                          setHidden(false); status.text = t("err") + ": " + (e.message ?: "").take(160)
                      } finally {
                          setHidden(false); busy = false; solveBtn.isEnabled = true
                          sigPrev = null; moving = false
                      }
                  }
              }

              private fun setHidden(hid: Boolean) { val a = if (hid) 0f else 1f; bubble?.alpha = a; panel?.alpha = a }

              private fun render() {
                  val r = last ?: return
                  ansTv.text = r.answer + if (showWhy && r.why.isNotBlank()) "\n\n" + r.why else ""
                  codeTv.text = r.code; codeTv.visibility = if (r.code.isBlank()) View.GONE else View.VISIBLE
                  scroll.visibility = View.VISIBLE; actions.visibility = View.VISIBLE
                  status.text = if (r.verified) t("verified") else t("unver") + if (r.note.isNotBlank()) ": " + r.note else ""
              }

              private fun btn(txt: String, color: Int, cb: () -> Unit) = Button(this).apply {
                  text = txt; isAllCaps = false; setTextColor(Color.WHITE); background = round(color, dp(12).toFloat()); setOnClickListener { cb() }
              }

              private fun buildUi() {
                  wm = getSystemService(WindowManager::class.java)
                  val type = WindowManager.LayoutParams.TYPE_APPLICATION_OVERLAY
                  val b = TextView(this).apply {
                      text = "Q"; textSize = 22f; setTextColor(Color.WHITE); gravity = Gravity.CENTER
                      background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFF5B4BFF.toInt()) }
                  }
                  val blp = WindowManager.LayoutParams(dp(52), dp(52), type, WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE, PixelFormat.TRANSLUCENT)
                      .apply { gravity = Gravity.TOP or Gravity.START; x = dp(8); y = dp(220) }
                  var sx = 0; var sy = 0; var tx = 0f; var ty = 0f; var moved = false
                  b.setOnTouchListener { v, e ->
                      when (e.action) {
                          MotionEvent.ACTION_DOWN -> { sx = blp.x; sy = blp.y; tx = e.rawX; ty = e.rawY; moved = false }
                          MotionEvent.ACTION_MOVE -> {
                              val dx = e.rawX - tx; val dy = e.rawY - ty
                              if (abs(dx) > 10 || abs(dy) > 10) moved = true
                              blp.x = sx + dx.toInt(); blp.y = sy + dy.toInt(); wm.updateViewLayout(v, blp)
                          }
                          MotionEvent.ACTION_UP -> if (!moved) setOpen(true)
                      }
                      true
                  }
                  bubble = b

                  val p = LinearLayout(this).apply {
                      orientation = LinearLayout.VERTICAL; setPadding(dp(14), dp(10), dp(14), dp(14))
                      background = round(0xF2161B31.toInt(), dp(18).toFloat()); visibility = View.GONE
                      layoutDirection = if (lang == 1) View.LAYOUT_DIRECTION_RTL else View.LAYOUT_DIRECTION_LTR
                  }
                  val head = LinearLayout(this).apply { gravity = Gravity.CENTER_VERTICAL }
                  head.addView(TextView(this).apply { text = "QUREO AI"; textSize = 16f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD }, LinearLayout.LayoutParams(0, -2, 1f))
                  head.addView(btn("—", 0x33FFFFFF) { setOpen(false) }, LinearLayout.LayoutParams(dp(52), dp(40)))
                  p.addView(head)
                  status = TextView(this).apply { text = t("ready"); textSize = 13f; setTextColor(0xFFB8BEDD.toInt()); setPadding(0, dp(4), 0, dp(8)) }
                  p.addView(status)
                  solveBtn = btn("⚡ " + t("solve"), 0xFF5B4BFF.toInt()) { solve() }.apply { textSize = 18f; typeface = Typeface.DEFAULT_BOLD }
                  p.addView(solveBtn, LinearLayout.LayoutParams(-1, dp(56)))
                  ansTv = TextView(this).apply { textSize = 17f; setTextColor(Color.WHITE); typeface = Typeface.DEFAULT_BOLD }
                  codeTv = TextView(this).apply {
                      textSize = 12f; setTextColor(0xFFCDD3FF.toInt()); typeface = Typeface.MONOSPACE; setPadding(dp(8), dp(8), dp(8), dp(8))
                      background = round(0xFF0B0E1F.toInt(), dp(8).toFloat()); layoutDirection = View.LAYOUT_DIRECTION_LTR; textDirection = View.TEXT_DIRECTION_LTR
                  }
                  val box = LinearLayout(this).apply { orientation = LinearLayout.VERTICAL; setPadding(0, dp(8), 0, 0) }
                  box.addView(ansTv); box.addView(codeTv, LinearLayout.LayoutParams(-1, -2).apply { topMargin = dp(8) })
                  scroll = ScrollView(this).apply { visibility = View.GONE; addView(box) }
                  p.addView(scroll, LinearLayout.LayoutParams(-1, (h * 0.28f).toInt()))
                  actions = LinearLayout(this).apply { visibility = View.GONE; setPadding(0, dp(8), 0, 0) }
                  actions.addView(btn(t("explain"), 0x33FFFFFF) { showWhy = !showWhy; render() }, LinearLayout.LayoutParams(0, dp(44), 1f).apply { marginEnd = dp(8) })
                  actions.addView(btn(t("copy"), 0x33FFFFFF) {
                      val r = last ?: return@btn
                      getSystemService(ClipboardManager::class.java).setPrimaryClip(ClipData.newPlainText("a", r.code.ifBlank { r.answer }))
                  }, LinearLayout.LayoutParams(0, dp(44), 1f))
                  p.addView(actions)
                  val plp = WindowManager.LayoutParams(w * 92 / 100, -2, type,
                      WindowManager.LayoutParams.FLAG_NOT_FOCUSABLE or WindowManager.LayoutParams.FLAG_NOT_TOUCH_MODAL, PixelFormat.TRANSLUCENT)
                      .apply { gravity = Gravity.BOTTOM or Gravity.CENTER_HORIZONTAL; y = dp(12) }
                  panel = p
                  wm.addView(p, plp)
                  wm.addView(b, blp)
              }

              private fun setOpen(open: Boolean) {
                  panel?.visibility = if (open) View.VISIBLE else View.GONE
                  bubble?.apply {
                      visibility = if (open) View.GONE else View.VISIBLE
                      if (open) { text = "Q"; background = GradientDrawable().apply { shape = GradientDrawable.OVAL; setColor(0xFF5B4BFF.toInt()) } }
                  }
              }

              override fun onDestroy() {
                  scope.cancel()
                  runCatching { bubble?.let { wm.removeView(it) } }
                  runCatching { panel?.let { wm.removeView(it) } }
                  held?.close(); vd?.release(); ir?.close(); mp?.stop()
                  super.onDestroy()
              }
          }
          EOF_FILE

      - run: yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
      - run: gradle :app:assembleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with: { name: qureo-ai-apk, path: app/build/outputs/apk/release/*.apk }
